<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>차오름 선생님</title>
<link rel="icon" href="icon-t-192.png">
<link rel="apple-touch-icon" href="icon-t-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="차오름 선생님">
<meta name="theme-color" content="#b8352e">
<style>
:root { --bg: #fbf6f1; --paper: #fff; --ink: #2a1d1a; --muted: #7a6a64; --brand: #b8352e; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a1413; --paper: #241c1a; --ink: #f3e9e5; --muted: #b3a29b; --brand: #f0675d; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
[hidden] { display: none !important; }
#intro { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 16px; text-align: center; }
img.icon { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto; box-shadow: 0 8px 24px rgba(120, 50, 30, .25); }
h1 { margin: 0; font-size: 1.6rem; }
.go { display: block; width: 100%; padding: 16px; border: 0; border-radius: 16px; background: var(--brand); color: #fff; font: inherit; font-weight: 800; font-size: 1.1rem; cursor: pointer; }
.card { background: var(--paper); border-radius: 18px; padding: 16px; text-align: left; box-shadow: 0 6px 20px rgba(120, 50, 30, .08); }
.card h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--brand); }
.card ol { margin: 0; padding-left: 20px; }
.card p { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
#frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding-top: env(safe-area-inset-top); background: var(--bg); }
</style>
</head>
<body>
<div id="intro" hidden>
  <img class="icon" src="icon-t-192.png" alt="">
  <h1>차오름 선생님</h1>
  <div id="ok" hidden>
    <button class="go" id="open" type="button">교사용 화면 열기</button>
    <div class="card" style="margin-top:16px">
      <h2>휴대폰 바탕화면에 추가하기</h2>
      <p><b>아이폰 (Safari)</b></p>
      <ol><li>아래쪽 공유 버튼(□↑)을 눌러요</li><li>‘홈 화면에 추가’를 눌러요</li></ol>
      <p><b>갤럭시 (Chrome·삼성 인터넷)</b></p>
      <ol><li>메뉴(⋮ 또는 ☰)를 눌러요</li><li>‘홈 화면에 추가’를 눌러요</li></ol>
      <p>추가한 아이콘을 누르면 교사용 화면이 바로 열려요. 학생에게 이 주소를 알려 주지 마세요.</p>
    </div>
  </div>
  <div class="card" id="nokey" hidden>
    <h2>선생님 전용 페이지예요</h2>
    <p>선생님이 받은 ‘교사용 QR’로 처음 한 번 열어 주세요.</p>
  </div>
</div>
<iframe id="frame" title="교사용 화면" hidden></iframe>
<script>
// 교사용 비밀 키는 이 파일에 없다. 선생님 QR 주소의 # 뒤(#k=…)로만 들어오고, 이 휴대폰에만 저장된다.
// 교사용 화면은 이 페이지 안에 넣어 보여 준다(구글 안내 줄이 나오지 않게).
var BASE = 'https://script.google.com/macros/s/AKfycby6wevH_4gLeDjdg3YTxjlE85Xf26Z8GayVvH4tvjqTacKxgBvPrCWRDm7wwlZsMAuQ/exec';
var h = new URLSearchParams(location.hash.slice(1));
var key = h.get('k') || '';
try { if (key) localStorage.setItem('chaoreumTeacherKey', key); else key = localStorage.getItem('chaoreumTeacherKey') || ''; } catch (e) {}
var url = BASE + '?p=teacher&k=' + encodeURIComponent(key) + '&embed=1&from=app';
function openApp() {
  document.getElementById('intro').hidden = true;
  var f = document.getElementById('frame'); f.hidden = false; f.src = url;
}
document.getElementById('open').onclick = openApp;
var setup = false, seen = false;
try { setup = sessionStorage.getItem('chaoreumTeacherSetup') === '1'; seen = localStorage.getItem('chaoreumTeacherSeen') === '1'; } catch (e) {}
if (key && !setup && (h.get('i') === '1' || seen)) {
  openApp();   // 바탕화면 아이콘으로 열었을 때: 안내 없이 바로 교사용 화면
} else if (key) {
  // 처음 연 때만 설치 안내를 보여 준다
  try { sessionStorage.setItem('chaoreumTeacherSetup', '1'); localStorage.setItem('chaoreumTeacherSeen', '1'); } catch (e) {}
  history.replaceState(null, '', location.pathname + '#k=' + encodeURIComponent(key) + '&i=1');
  document.getElementById('intro').hidden = false;
  document.getElementById('ok').hidden = false;
} else {
  document.getElementById('intro').hidden = false;
  document.getElementById('nokey').hidden = false;
}
</script>
</body>
</html>
