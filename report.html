<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>학습 리포트</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root {
  --bg: #f3f4f1; --paper: #ffffff; --ink: #1c1f1d; --muted: #67706b; --line: #dde2dd;
  --accent: #d8524a; --accent-soft: #fbe7e4; --me: #2459c4; --class: #9aa39d;
  --ok: #1f7a4d; --ok-soft: #e0f1e7; --warn: #a86400; --warn-soft: #fff1d9; --bad: #c23b22; --bad-soft: #fde3dc;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151816; --paper: #1f2320; --ink: #eaeeea; --muted: #a1aaa4; --line: #343a36;
    --accent: #f07a70; --accent-soft: #3a2422; --me: #7fa6ff; --class: #6e7871;
    --ok: #5fcf93; --ok-soft: #1c3428; --warn: #f0b04a; --warn-soft: #3a2d14; --bad: #ff8a72; --bad-soft: #3f231d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 56px; display: grid; gap: 16px; }
header .logo { display: block; height: 48px; width: auto; max-width: 100%; margin-bottom: 10px; }
@media (prefers-color-scheme: dark) { header .logo { background: #fff; padding: 4px 8px; border-radius: 8px; } }
header .academy { color: var(--accent); font-weight: 700; font-size: .9rem; letter-spacing: .02em; }
header h1 { margin: 2px 0 0; font-size: 1.5rem; line-height: 1.3; text-wrap: balance; }
header .meta { color: var(--muted); font-size: .85rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 1.02rem; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .tiles .tile:last-child { grid-column: span 2; } }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 2px; }
.tile .k { font-size: .8rem; color: var(--muted); }
.tile .v { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .s { font-size: .8rem; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); }
.comment { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; white-space: pre-wrap; }
.comment .d { display: block; font-size: .78rem; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
details .comment { margin-top: 10px; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
svg text { font-family: inherit; }
.chart-wrap { overflow-x: auto; }
.unit { display: grid; grid-template-columns: minmax(70px, 120px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: .9rem; }
.unit .name { overflow-wrap: anywhere; }
.bar { position: relative; height: 12px; background: var(--bg); border-radius: 99px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.bar .cls { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.unit .pct { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .78rem; padding: 2px 10px; border-radius: 99px; font-weight: 700; }
.pill.weak { background: var(--bad-soft); color: var(--bad); } .pill.mid { background: var(--warn-soft); color: var(--warn); } .pill.good { background: var(--ok-soft); color: var(--ok); }
.weak-list { display: flex; flex-wrap: wrap; gap: 6px; }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 100%; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 5px; }
.qgrid span { text-align: center; border-radius: 6px; padding: 4px 0; font-size: .82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.qgrid .o { background: var(--ok-soft); color: var(--ok); } .qgrid .x { background: var(--bad-soft); color: var(--bad); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: .78rem; }
td.note { white-space: normal; color: var(--warn); font-size: .8rem; }
.att-sum { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }
footer { color: var(--muted); font-size: .78rem; text-align: center; }
/* 내용이 길어도 화면이 옆으로 커지지 않게: 긴 글은 줄을 바꾸고, 칸과 그림은 화면 너비를 넘지 않는다 */
html, body { max-width: 100%; overflow-x: hidden; }
body { overflow-wrap: anywhere; }
main, main > *, section, .card, .card > * { min-width: 0; max-width: 100%; }
img, canvas, svg, video, iframe { max-width: 100%; }
table { display: block; max-width: 100%; overflow-x: auto; }
</style>
</head>
<body>
<main id="app"></main>
<script>
var LOGO = 'logo.png';
function draw(DATA) {
  var app = document.getElementById('app'); app.innerHTML = '';
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function card(title) { var c = el('section', 'card'); c.appendChild(el('h2', null, title)); app.appendChild(c); return c; }
  function ans(a) { return a === -1 ? '중복' : a === 0 || a == null || isNaN(a) ? '—' : String(a); }

  if (!DATA) {
    var c = card('링크를 확인해 주세요');
    c.appendChild(el('p', 'empty', '이 링크로는 리포트를 찾을 수 없어요. 학원에서 받은 링크 전체가 열렸는지 확인하거나 학원에 문의해 주세요.'));
    return;
  }
  var D = DATA, ex = D.exams, last = ex[ex.length - 1], prev = ex[ex.length - 2];

  // 머리말
  var hd = el('header');
  if (LOGO) { var lg0 = el('img', 'logo'); lg0.src = LOGO; lg0.alt = D.academy; hd.appendChild(lg0); }
  else hd.appendChild(el('div', 'academy', D.academy));
  hd.appendChild(el('h1', null, D.student.name + ' 학생 학습 리포트'));
  hd.appendChild(el('div', 'meta', [D.student.school, D.student.cls].filter(Boolean).concat([D.generated + ' 기준']).join(' · ')));
  app.appendChild(hd);

  // 요약
  var tiles = el('div', 'tiles'); app.appendChild(tiles);
  function tile(k, v, s, sCls) {
    var t = el('div', 'tile'); t.appendChild(el('div', 'k', k)); t.appendChild(el('div', 'v', v));
    if (s) t.appendChild(el('div', 's' + (sCls ? ' ' + sCls : ''), s)); tiles.appendChild(t);
  }
  if (last) {
    var diff = prev ? Math.round((last.pct - prev.pct) * 10) / 10 : null;
    tile('최근 시험', last.pct + '%', diff == null ? '반 평균 ' + last.classAvg + '%' : (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(diff) + '%p (지난 시험 대비)', diff == null ? '' : diff >= 0 ? 'up' : 'down');
    tile('반 평균 대비', (last.pct - last.classAvg >= 0 ? '+' : '') + Math.round((last.pct - last.classAvg) * 10) / 10 + '%p', '반 평균 ' + last.classAvg + '%');
  } else { tile('최근 시험', '—', '아직 응시 기록이 없어요'); tile('반 평균 대비', '—', ''); }
  var clinic = D.attendance.filter(function (a) { return a.type.indexOf('클리닉') >= 0 || !a.type; });
  var present = clinic.filter(function (a) { return a.status === '출석' || a.status === '보강'; }).length;
  tile('클리닉 출석', clinic.length ? present + '/' + clinic.length + '회' : '—', clinic.length ? '출석률 ' + Math.round(present / clinic.length * 100) + '%' : '기록 없음');

  // 선생님 한마디
  var cc = card('선생님 한마디');
  if (!D.comments.length) cc.appendChild(el('p', 'empty', '아직 등록된 내용이 없어요.'));
  D.comments.forEach(function (m, i) {
    var box = el('div', 'comment'); box.appendChild(el('span', 'd', m.date + (D.teacher ? ' · ' + D.teacher + ' 선생님' : '')));
    box.appendChild(document.createTextNode(m.text));
    if (i === 0) cc.appendChild(box);
    else { if (i === 1) { var det = el('details'); det.appendChild(el('summary', null, '지난 한마디 ' + (D.comments.length - 1) + '개 보기')); cc.appendChild(det); } cc.lastChild.appendChild(box); }
  });

  // 점수 추이
  var tc = card('복습테스트 점수 추이');
  if (!ex.length) tc.appendChild(el('p', 'empty', '시험 기록이 생기면 여기에 그래프가 나와요.'));
  else {
    var lg = el('div', 'legend');
    lg.innerHTML = '<span><i style="background:var(--me)"></i>' + '내 점수</span><span><i style="background:var(--class)"></i>반 평균</span>';
    tc.appendChild(lg);
    var wrap = el('div', 'chart-wrap'); tc.appendChild(wrap);
    wrap.appendChild(lineChart(ex));
    var tw = el('div', 'table-wrap'), tb = el('table');
    tb.innerHTML = '<thead><tr><th>날짜</th><th>시험</th><th>점수</th><th>반 평균</th></tr></thead>';
    var body = el('tbody');
    ex.slice().reverse().forEach(function (e) {
      var tr = el('tr');
      [e.date, e.name, e.score + ' / ' + e.total, e.classAvg + '%'].forEach(function (v) { tr.appendChild(el('td', null, v)); });
      body.appendChild(tr);
    });
    tb.appendChild(body); tw.appendChild(tb); tc.appendChild(tw);
  }

  function lineChart(list) {
    var NS = 'http://www.w3.org/2000/svg', W = Math.max(320, list.length * 56), H = 210, pl = 34, pr = 26, pt = 20, pb = 34;
    var s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 ' + W + ' ' + H); s.setAttribute('width', '100%');
    if (list.length > 6) s.style.minWidth = W + 'px'; // 시험이 많으면 가로로 스크롤
    function n(tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; }
    var X = function (i) { return list.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (list.length - 1); };
    var Y = function (v) { return pt + (100 - v) / 100 * (H - pt - pb); };
    [0, 50, 100].forEach(function (v) {
      n('line', { x1: pl, x2: W - pr, y1: Y(v), y2: Y(v), stroke: 'var(--line)', 'stroke-width': 1 });
      var t = n('text', { x: pl - 6, y: Y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }); t.textContent = v;
    });
    function path(key, color, dash) {
      var d = list.map(function (e, i) { return (i ? 'L' : 'M') + X(i) + ' ' + Y(e[key]); }).join(' ');
      n('path', { d: d, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-dasharray': dash || '', 'stroke-linejoin': 'round' });
    }
    path('classAvg', 'var(--class)', '5 4'); path('pct', 'var(--me)');
    list.forEach(function (e, i) {
      n('circle', { cx: X(i), cy: Y(e.pct), r: i === list.length - 1 ? 5.5 : 4, fill: 'var(--me)', stroke: 'var(--paper)', 'stroke-width': 2 });
      var v = n('text', { x: X(i), y: Y(e.pct) - 9, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, fill: 'var(--me)' }); v.textContent = e.pct;
      var lb = n('text', { x: X(i), y: H - 12, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }); lb.textContent = e.date.slice(5);
    });
    return s;
  }

  // 취약한 점
  var uc = card('단원별 정답률 · 취약한 점');
  if (!D.units.length) uc.appendChild(el('p', 'empty', '시험 기록이 생기면 단원별 분석이 나와요.'));
  else {
    var weak = D.units.filter(function (u) { return u.rate < 70 && u.total >= 2; }).slice(0, 3);
    var wl = el('div', 'weak-list');
    if (weak.length) {
      uc.appendChild(el('p', null, '보충이 필요한 단원'));
      weak.forEach(function (u) { wl.appendChild(el('span', 'pill weak', u.unit + ' ' + u.rate + '%')); });
    } else wl.appendChild(el('span', 'pill good', '정답률 70% 미만인 단원이 없어요'));
    uc.appendChild(wl);
    var lg2 = el('div', 'legend'); lg2.innerHTML = '<span>막대: 내 정답률</span><span><i style="background:var(--ink);opacity:.55;width:2px;height:12px"></i>반 평균</span>';
    uc.appendChild(lg2);
    D.units.forEach(function (u) {
      var row = el('div', 'unit'); row.appendChild(el('div', 'name', u.unit + ' (' + u.total + '문항)'));
      var bar = el('div', 'bar'), f = el('div', 'fill'), c2 = el('div', 'cls');
      f.style.width = u.rate + '%'; f.style.background = u.rate < 50 ? 'var(--bad)' : u.rate < 70 ? 'var(--warn)' : 'var(--ok)';
      c2.style.left = 'calc(' + u.classRate + '% - 1px)'; c2.title = '반 평균 ' + u.classRate + '%';
      bar.appendChild(f); bar.appendChild(c2); row.appendChild(bar); row.appendChild(el('div', 'pct', u.rate + '%'));
      uc.appendChild(row);
    });
  }

  // 유형별 정답률 (문항 탭 '유형' 열이 있는 시험만)
  var TY = D.types || [];
  if (TY.length) {
    var tc = card('유형별 정답률');
    var tweak = TY.filter(function (u) { return u.rate < 70 && u.total >= 2; }).slice(0, 3);
    var twl = el('div', 'weak-list');
    if (tweak.length) {
      tc.appendChild(el('p', null, '보충이 필요한 유형'));
      tweak.forEach(function (u) { twl.appendChild(el('span', 'pill weak', u.unit + ' ' + u.rate + '%')); });
    } else twl.appendChild(el('span', 'pill good', '정답률 70% 미만인 유형이 없어요'));
    tc.appendChild(twl);
    var lg3 = el('div', 'legend'); lg3.innerHTML = '<span>막대: 내 정답률</span><span><i style="background:var(--ink);opacity:.55;width:2px;height:12px"></i>반 평균</span>';
    tc.appendChild(lg3);
    TY.forEach(function (u) {
      var row = el('div', 'unit'); row.appendChild(el('div', 'name', u.unit + ' (' + u.total + '문항)'));
      var bar = el('div', 'bar'), f = el('div', 'fill'), c3 = el('div', 'cls');
      f.style.width = u.rate + '%'; f.style.background = u.rate < 50 ? 'var(--bad)' : u.rate < 70 ? 'var(--warn)' : 'var(--ok)';
      c3.style.left = 'calc(' + u.classRate + '% - 1px)'; c3.title = '반 평균 ' + u.classRate + '%';
      bar.appendChild(f); bar.appendChild(c3); row.appendChild(bar); row.appendChild(el('div', 'pct', u.rate + '%'));
      tc.appendChild(row);
    });
  }

  // 문제 분석
  var qc = card('시험별 문제 분석');
  if (!ex.length) qc.appendChild(el('p', 'empty', '시험 기록이 없어요.'));
  else {
    var sel = el('select'); sel.id = 'examSel';
    ex.slice().reverse().forEach(function (e, i) { var o = el('option', null, e.date + ' ' + e.name); o.value = ex.length - 1 - i; sel.appendChild(o); });
    qc.appendChild(sel);
    var holder = el('div'); holder.style.display = 'grid'; holder.style.gap = '12px'; qc.appendChild(holder);
    var renderExam = function () {
      var e = ex[Number(sel.value)]; holder.innerHTML = '';
      var wrongN = e.questions.filter(function (q) { return !q.ok; }).length;
      holder.appendChild(el('div', null, e.score + ' / ' + e.total + '점 · ' + (e.questions.length - wrongN) + '/' + e.questions.length + '문항 정답 · 응시 ' + e.takers + '명'));
      var g = el('div', 'qgrid');
      e.questions.forEach(function (q) { g.appendChild(el('span', q.ok ? 'o' : 'x', q.no + (q.ok ? ' O' : ' X'))); });
      holder.appendChild(g);
      var wrong = e.questions.filter(function (q) { return !q.ok; });
      if (!wrong.length) { holder.appendChild(el('span', 'pill good', '모든 문항 정답')); return; }
      var tw2 = el('div', 'table-wrap'), t2 = el('table'), hasKey = wrong.some(function (q) { return q.answer != null; });
      var hasType = wrong.some(function (q) { return q.type; });
      t2.innerHTML = '<thead><tr><th>문항</th><th>단원</th>' + (hasType ? '<th>유형</th>' : '') + '<th>쓴 답</th>' + (hasKey ? '<th>정답</th>' : '') + '<th>반 정답률</th><th></th></tr></thead>';
      var b2 = el('tbody');
      wrong.forEach(function (q) {
        var tr = el('tr');
        tr.appendChild(el('td', null, q.no + '번')); tr.appendChild(el('td', null, q.unit));
        if (hasType) tr.appendChild(el('td', null, q.type || ''));
        tr.appendChild(el('td', null, ans(q.mine)));
        if (hasKey) tr.appendChild(el('td', null, ans(q.answer)));
        tr.appendChild(el('td', null, q.classRate + '%'));
        tr.appendChild(el('td', 'note', q.classRate >= 80 ? '반 대부분이 맞힌 문제 · 실수 점검' : q.mine === 0 ? '답을 비워 둠' : ''));
        b2.appendChild(tr);
      });
      t2.appendChild(b2); tw2.appendChild(t2); holder.appendChild(tw2);
    };
    sel.addEventListener('change', renderExam); renderExam();
  }

  // 출석
  var ac = card('클리닉 출석');
  if (!D.attendance.length) ac.appendChild(el('p', 'empty', '출석 기록이 없어요.'));
  else {
    var counts = {}; D.attendance.forEach(function (a) { counts[a.status] = (counts[a.status] || 0) + 1; });
    var sum = el('div', 'att-sum');
    Object.keys(counts).forEach(function (k) { sum.appendChild(el('span', 'pill ' + (k === '결석' ? 'weak' : k === '지각' ? 'mid' : 'good'), k + ' ' + counts[k] + '회')); });
    ac.appendChild(sum);
    var tw3 = el('div', 'table-wrap'), t3 = el('table');
    t3.innerHTML = '<thead><tr><th>날짜</th><th>구분</th><th>상태</th><th>메모</th></tr></thead>';
    var b3 = el('tbody');
    D.attendance.slice(0, 20).forEach(function (a) {
      var tr = el('tr'); [a.date, a.type, a.status, a.memo].forEach(function (v) { tr.appendChild(el('td', null, v)); }); b3.appendChild(tr);
    });
    t3.appendChild(b3); tw3.appendChild(t3); ac.appendChild(tw3);
  }

  app.appendChild(el('footer', null, '이 링크는 ' + D.student.name + ' 학생 보호자 전용입니다. 다른 사람과 공유하지 말아 주세요.'));
}
// 속도: 이 휴대폰에 지난번 리포트를 기억해 두고 먼저 보여 준 뒤, 새 자료가 오면 바꾼다
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycby6wevH_4gLeDjdg3YTxjlE85Xf26Z8GayVvH4tvjqTacKxgBvPrCWRDm7wwlZsMAuQ/exec';
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  var key = (q.get('r') || h.get('r') || '').trim();
  var app = document.getElementById('app');
  if (!/^[0-9a-f]{32}$/.test(key)) { draw(null); return; }
  var saved = null, lk = 'chaoreumRp:' + key;
  try { saved = localStorage.getItem(lk); } catch (e) {}
  if (saved) { try { draw(JSON.parse(saved)); } catch (e) { saved = null; } }
  if (!saved) app.innerHTML = '<p class="empty" style="text-align:center;padding:40px 0">리포트를 불러오는 중…</p>';
  fetch(BASE + '?p=api&f=getReport&a=' + encodeURIComponent(JSON.stringify([key])))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.err || '');
      var s = JSON.stringify(j.r);
      if (s !== saved) draw(j.r);
      try { if (j.r) localStorage.setItem(lk, s); else localStorage.removeItem(lk); } catch (e) {}
    })
    .catch(function () {
      if (!saved) app.innerHTML = '<p class="empty" style="text-align:center;padding:40px 0">리포트를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</p>';
    });
})();
</script>
</body>
</html>
