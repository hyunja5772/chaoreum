<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차오름학원</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="차오름">
<meta name="theme-color" content="#b8352e">
<style>
:root { --bg: #fbf6f1; --paper: #fff; --ink: #2a1d1a; --muted: #7a6a64; --brand: #b8352e; --soft: #fde9e5; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a1413; --paper: #241c1a; --ink: #f3e9e5; --muted: #b3a29b; --brand: #f0675d; --soft: #3c2421; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 16px; text-align: center; }
img.icon { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto; box-shadow: 0 8px 24px rgba(120, 50, 30, .25); }
h1 { margin: 0; font-size: 1.6rem; }
.go { display: block; padding: 16px; border-radius: 16px; background: var(--brand); color: #fff; font-weight: 800; font-size: 1.1rem; text-decoration: none; }
.card { background: var(--paper); border-radius: 18px; padding: 16px; text-align: left; box-shadow: 0 6px 20px rgba(120, 50, 30, .08); }
.card h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--brand); }
.card ol { margin: 0; padding-left: 20px; }
.card p { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-192.png" alt="">
  <h1>차오름학원</h1>
  <a class="go" id="go" href="#">앱 열기</a>
  <div class="card">
    <h2>휴대폰 바탕화면에 추가하기</h2>
    <p><b>아이폰 (Safari)</b></p>
    <ol><li>아래쪽 공유 버튼(□↑)을 눌러요</li><li>‘홈 화면에 추가’를 눌러요</li></ol>
    <p><b>갤럭시 (Chrome·삼성 인터넷)</b></p>
    <ol><li>메뉴(⋮ 또는 ☰)를 눌러요</li><li>‘홈 화면에 추가’를 눌러요</li></ol>
    <p>카카오톡 안에서 열었다면 먼저 ‘다른 브라우저로 열기’를 눌러 주세요.</p>
  </div>
</main>
<script>
// 학생용 앱(OMR 채점·재시험) 주소
var APP = 'https://script.google.com/macros/s/AKfycby6wevH_4gLeDjdg3YTxjlE85Xf26Z8GayVvH4tvjqTacKxgBvPrCWRDm7wwlZsMAuQ/exec?p=home';
document.getElementById('go').href = APP;
// 바탕화면 아이콘으로 열었으면 바로 앱으로 이동
var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
if (standalone || /[?&]app=1\b/.test(location.search)) location.replace(APP);
</script>
</body>
</html>
